[package]
name = "jarvis"
version = "0.1.0"
edition = "2021"

[profile.release]
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "jarvis"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "fs", "signal", "net"] }
tokio-util = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
tokio-stream = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = "0.0.29"
thiserror = "2.0"
ringbuf = "0.5"
# `cpal` no se declara como dependencia directa: se usa el reexport
# `rodio::cpal` en todo el proyecto (audio/player.rs, audio/music.rs,
# startup_checks.rs) para que solo haya una copia de cpal en el árbol de
# dependencias — dos copias con distinto `links = "alsa"` no resuelven.
rodio = { version = "0.20", default-features = false, features = ["symphonia-mp3"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
dotenvy = "0.15"
clap = { version = "4", features = ["derive"] }
regex = "1"
chrono = "0.4"
sysinfo = "0.33"
starship-battery = "0.10"
rand = "0.8"
walkdir = "2"
scraper = "0.22"
url = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
base64 = "0.22"
futures-util = "0.3"
xcap = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
ratatui = "0.30.2"
crossterm = "0.29.0"
tracing-appender = "0.2.5"
# Mouse/teclado simulado (mouse_move, mouse_click, media_control):
# cross-platform (Windows/macOS/Linux X11) por diseño, así que va acá y no
# en el target Windows-only de abajo. En Linux/Wayland puede no funcionar
# sin soporte explícito del compositor (limitación conocida de enigo).
enigo = "0.2"
# Cliente MCP (Model Context Protocol): SDK oficial, en vez de implementar
# JSON-RPC + negociación de capacidades a mano. Solo el transporte stdio
# (proceso hijo local) por ahora — HTTP/SSE queda para una etapa posterior.
rmcp = { version = "3", default-features = false, features = ["client", "transport-child-process", "which-command"] }
# Servidor HTTP embebido de la página de configuración local (src/config_ui/),
# solo 127.0.0.1: API de lectura/escritura de config.yaml + estáticos del
# frontend (web/config-ui/dist).
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", default-features = false, features = ["fs"] }

# Solo se usa en Windows (Core Audio, Job Objects, SendInput histórico,
# consola) — en otras plataformas ni se descarga ni se compila.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Security", "Win32_System_Com", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
