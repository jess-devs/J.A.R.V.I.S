name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    # windows-latest: plataforma principal, con más tests (ej. clasificación
    # de riesgo de run_powershell). ubuntu-latest: valida el soporte Linux/Mac
    # multiplataforma — compila con `windows` excluido vía
    # cfg y corre los tests cfg(unix) (ej. run_shell). macOS no está en la
    # matriz por ahora (sin runner propio del proyecto para justificar el
    # costo/tiempo extra de CI; el código unix-genérico ya se ejercita en
    # ubuntu-latest).
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust estable
        uses: dtolnay/rust-toolchain@stable

      - name: Cachear dependencias de cargo
        uses: Swatinem/rust-cache@v2

      - name: Instalar dependencias de sistema (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libx11-dev libxdo-dev libxtst-dev libxext-dev libasound2-dev

      - name: cargo build
        run: cargo build --verbose

      - name: cargo test
        run: cargo test --verbose

  python:
    # Los workers reales (STT/TTS) necesitan hardware de audio y modelos
    # pesados (torch, faster-whisper) — no se corren en CI. Este job solo
    # ejercita la lógica pura y testeable (ver workers/tests/), que no
    # depende de RealtimeSTT/PyAudio.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de test
        run: pip install -r workers/requirements-dev.txt

      - name: pytest
        run: python -m pytest workers/tests -v

  privacy-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buscar archivos privados trackeados
        run: |
          PATTERN='\.(db|db-wal|db-shm|db-journal|sqlite|sqlite3|log|wav|mp3|pcm|raw|flac|ogg|m4a|opus|webm)$|\.stt\.|transcript[^/]*\.(txt|json|log|csv|md)$|(^|/)speaker_embedding\.json$|(^|/)config\.yaml$|\.env(\.|$)|(^|/)\.venv/|(^|/)__pycache__/'
          MATCHES=$(git ls-files \
            | grep -E "$PATTERN" \
            | grep -v '\.env\.example$' \
            | grep -v '^tests/fixtures/' \
            || true)
          if [ -n "$MATCHES" ]; then
            echo "Archivos que no deberían estar trackeados (datos privados/dependencias locales):"
            echo "$MATCHES"
            exit 1
          fi
